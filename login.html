<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Stateline Login</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#080b13; --text:#eef1f8; --dim:#8b95ab;
    --cyan:#22d3ee; --violet:#a78bfa; --cyan-rgb:34,211,238; --violet-rgb:167,139,250;
    --glass:rgba(255,255,255,0.045); --border:rgba(255,255,255,0.09);
    --font-display:'Sora',sans-serif; --font-body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:var(--font-body); background:var(--void); color:var(--text); display:flex; justify-content:center; align-items:center; min-height:100vh; position:relative; overflow:hidden; padding:20px; }

  .orb{ position:fixed; border-radius:50%; filter:blur(90px); opacity:0.35; z-index:0; animation:drift 26s ease-in-out infinite alternate; }
  .orb1{ width:480px; height:480px; background:var(--cyan); top:-160px; left:-140px; }
  .orb2{ width:420px; height:420px; background:var(--violet); bottom:-140px; right:-120px; animation-delay:-9s; }
  @keyframes drift{ from{ transform:translate(0,0) scale(1);} to{ transform:translate(30px,-25px) scale(1.08);} }
  @media (prefers-reduced-motion: reduce){ .orb{ animation:none; } }

  .wrap{ position:relative; z-index:1; width:400px; max-width:100%; padding:38px 32px; background:var(--glass); border-radius:22px; border:1px solid var(--border); backdrop-filter:blur(24px) saturate(140%); box-shadow:0 24px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05); }

  .logo-container{ text-align:center; margin-bottom:28px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .brand-mark{ width:46px; height:46px; border-radius:13px; background:linear-gradient(135deg, var(--cyan), var(--violet)); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:20px; color:#0a0e18; }
  h2.brand{ margin:0; font-family:var(--font-display); font-size:26px; font-weight:800; letter-spacing:0.5px; color:var(--text); }
  .credit{ font-size:10px; color:#5c6478; font-weight:600; letter-spacing:2px; text-transform:uppercase; }

  input,select{ width:100%; padding:12px; margin:7px 0; background:rgba(0,0,0,0.2); border:1px solid var(--border); color:var(--text); border-radius:11px; box-sizing:border-box; transition:all 0.25s ease; outline:none; font-family:var(--font-body); font-size:13.5px; }
  input:focus, select:focus{ border-color:var(--cyan); background:rgba(0,0,0,0.32); }
  select option{ background:#131829; color:white; }

  .password-wrap{ position:relative; width:100%; margin:7px 0; }
  .password-wrap input{ margin:0; padding-right:42px; }
  .toggle-eye{ position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:16px; padding:0; opacity:0.6; transition:opacity 0.2s; }
  .toggle-eye:hover{ opacity:1; }

  button.primary{ width:100%; padding:13px; background:linear-gradient(to right, var(--cyan), #0891b2); border:none; border-radius:11px; color:#031018; font-weight:700; margin-top:14px; cursor:pointer; display:flex; justify-content:center; align-items:center; min-height:46px; transition:transform 0.2s, opacity 0.2s; font-family:var(--font-body); font-size:14px; }
  button.primary:hover{ opacity:0.92; transform:translateY(-1px); }
  button:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }

  .link{ color:var(--dim); font-size:12.5px; text-decoration:none; cursor:pointer; background:none; border:none; padding:5px; font-family:var(--font-body); }
  .link:hover{ color:var(--cyan); text-decoration:underline; }
  .hidden{ display:none; }
  .notice{ padding:11px; margin-top:12px; border-radius:9px; font-size:12.5px; text-align:center; display:none; }
  .notice.err{ background:rgba(220,38,38,0.15); color:#fca5a5; border:1px solid rgba(220,38,38,0.3); }
  .notice.ok{ background:rgba(34,211,238,0.12); color:#67e8f9; border:1px solid rgba(34,211,238,0.3); }
  .loader{ width:20px; height:20px; border:3px solid rgba(3,16,24,0.3); border-radius:50%; border-top-color:#031018; animation:spin 0.8s ease-in-out infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="orb orb1"></div><div class="orb orb2"></div>
<div class="wrap">
  <div class="logo-container">
    <div class="brand-mark">S</div>
    <h2 class="brand">STATELINE</h2>
    <div class="credit">By Panav Gohil</div>
  </div>

  <div id="viewLogin">
    <select id="loginMethod" onchange="toggleLogin()"><option value="roll">Roll Number</option><option value="email">Email</option></select>
    <input id="loginRoll" placeholder="Roll Number">
    <input id="loginEmail" placeholder="Email" class="hidden">

    <div class="password-wrap">
      <input id="loginPass" type="password" placeholder="Password">
      <button class="toggle-eye" onclick="togglePass('loginPass', this)">👁️</button>
    </div>

    <button class="primary" id="btnLogin" onclick="doLogin()">Login</button>
    <div style="text-align:center;margin-top:18px; display:flex; justify-content:space-around;">
      <button class="link" onclick="setView('reg')">Create Account</button>
      <button class="link" onclick="setView('forgot')">Forgot Password?</button>
    </div>
  </div>

  <div id="viewReg" class="hidden">
    <h3 style="text-align:center; color:var(--text); margin-top:0; font-family:var(--font-display);">New Account</h3>
    <div id="regStep1">
      <input id="regName" placeholder="Full Name">
      <input id="regRoll" placeholder="Roll Number">
      <input id="regEmail" placeholder="Email">
      <select id="regBranch"><option value="" disabled selected>Select Branch</option><option value="MCE-1">MCE-1</option><option value="MCE-2">MCE-2</option><option value="MCE-3">MCE-3</option><option value="EP-1">EP-1</option><option value="EP-2">EP-2</option><option value="BT">BT</option><option value="CE-1">CE-1</option><option value="CE-2">CE-2</option><option value="CSE-1">CSE-1</option><option value="CSE-2">CSE-2</option><option value="CSE-3">CSE-3</option><option value="CSE-4">CSE-4</option><option value="CSE-5">CSE-5</option><option value="CSE-6">CSE-6</option><option value="DSA">DSA</option><option value="EE-1">EE-1</option><option value="EE-2">EE-2</option><option value="EE-3">EE-3</option><option value="EE-4">EE-4</option><option value="EE-5">EE-5</option><option value="ECE-1">ECE-1</option><option value="ECE-2">ECE-2</option><option value="ECE-3">ECE-3</option><option value="VLSI">VLSI</option><option value="ENE">ENE</option><option value="IT-1">IT-1</option><option value="IT-2">IT-2</option><option value="CY">Cyber Security</option><option value="ME-1">ME-1</option><option value="ME-2">ME-2</option><option value="ME-3">ME-3</option><option value="ME-4">ME-4</option><option value="AE">AE</option><option value="PIE">PIE</option><option value="SE-1">SE-1</option><option value="SE-2">SE-2</option><option value="SE-3">SE-3</option><option value="CHE">CHE</option></select>

      <div class="password-wrap">
        <input id="regPass" type="password" placeholder="Create Password">
        <button class="toggle-eye" onclick="togglePass('regPass', this)">👁️</button>
      </div>

      <button class="primary" id="btnRegOtp" onclick="sendRegOtp()">Send Verification Code</button>
    </div>
    <div id="regStep2" class="hidden"><p style="color:#67e8f9;font-size:12.5px;text-align:center;">Code sent to your email!</p><input id="regOtp" placeholder="Enter 6-digit Code" style="text-align:center; letter-spacing:3px;"><button class="primary" id="btnRegFinal" onclick="doRegister()">Verify & Register</button></div>
    <button class="link" onclick="setView('login')" style="margin-top:14px; width:100%;">Back to Login</button>
  </div>

  <div id="viewForgot" class="hidden">
    <h3 style="text-align:center; color:var(--text); margin-top:0; font-family:var(--font-display);">Reset Password</h3>
    <div id="forgotStep1"><p style="font-size:12.5px; color:var(--dim); text-align:center;">Enter your email to receive a reset code.</p><input id="forgotEmail" placeholder="Registered Email"><button class="primary" id="btnForgotOtp" onclick="sendForgotOtp()">Send Reset Code</button></div>
    <div id="forgotStep2">
      <input id="forgotOtp" placeholder="Enter Code" style="text-align:center; letter-spacing:3px;">
      <div class="password-wrap">
        <input id="forgotNewPass" type="password" placeholder="New Password">
        <button class="toggle-eye" onclick="togglePass('forgotNewPass', this)">👁️</button>
      </div>
      <button class="primary" id="btnForgotFinal" onclick="doReset()">Change Password</button>
    </div>
    <button class="link" onclick="setView('login')" style="margin-top:14px; width:100%;">Back to Login</button>
  </div>
  <div id="msgBox" class="notice"></div>
</div>

<!-- config.js is gitignored — see config.example.js for the template -->
<script src="config.js"></script>
<script>
if (!window.STATELINE_CONFIG || !window.STATELINE_CONFIG.SCRIPT_URL || window.STATELINE_CONFIG.SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
  alert("Missing config.js — copy config.example.js to config.js and add your Apps Script URL.");
}
const API_URL = (window.STATELINE_CONFIG && window.STATELINE_CONFIG.SCRIPT_URL) || "";

function toggleLogin() { const isRoll = document.getElementById("loginMethod").value === "roll"; document.getElementById("loginRoll").classList.toggle("hidden", !isRoll); document.getElementById("loginEmail").classList.toggle("hidden", isRoll); }
function setView(v) { ['viewLogin','viewReg','viewForgot'].forEach(id=>document.getElementById(id).classList.add('hidden')); document.getElementById('view'+v.charAt(0).toUpperCase()+v.slice(1)).classList.remove('hidden'); document.getElementById('msgBox').style.display='none'; }

function togglePass(inputId, btn) {
  const input = document.getElementById(inputId);
  if (input.type === "password") { input.type = "text"; btn.innerText = "🙈"; }
  else { input.type = "password"; btn.innerText = "👁️"; }
}

async function post(data, btnId) {
  const btn = document.getElementById(btnId); const origText = btn.innerText;
  btn.innerHTML = '<div class="loader"></div>'; btn.disabled = true; document.getElementById('msgBox').style.display='none';
  try { const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(data) }); const json = await res.json(); btn.innerHTML = origText; btn.disabled = false; return json; }
  catch(e) { btn.innerHTML = origText; btn.disabled = false; showMsg("Connection Error. Check internet.", "err"); return { status: "error" }; }
}
function showMsg(txt, type) { const m = document.getElementById('msgBox'); m.innerText = txt; m.className = "notice " + type; m.style.display='block'; }

async function doLogin() {
  const method = document.getElementById("loginMethod").value;
  const id = method==='roll' ? document.getElementById('loginRoll').value : document.getElementById("loginEmail").value;
  const pass = document.getElementById('loginPass').value;
  const r = await post({ type:"login", identifier:id, password:pass }, 'btnLogin');
  if(r.status==="success") {
    localStorage.setItem("userName", r.name); localStorage.setItem("userRoll", r.roll); localStorage.setItem("userBranch", r.branch); localStorage.setItem("userPass", pass);
    if(r.email) localStorage.setItem("userEmail", r.email);
    if(typeof r.reportOptIn !== "undefined") localStorage.setItem("reportOptIn", r.reportOptIn ? "true" : "false");
    if(r.schedule) localStorage.setItem("mySchedule", r.schedule);
    window.location.href="index.html";
  } else showMsg(r.message||"Login failed", "err");
}

async function sendRegOtp() {
  const data = { type: "reg-send-otp", name: document.getElementById('regName').value, roll: document.getElementById('regRoll').value, email: document.getElementById('regEmail').value, branch: document.getElementById('regBranch').value, password: document.getElementById('regPass').value };
  if(!data.branch) return showMsg("Please select a branch", "err");
  const r = await post(data, 'btnRegOtp');
  if(r.status==="otp_sent") { document.getElementById('regStep1').classList.add('hidden'); document.getElementById('regStep2').classList.remove('hidden'); } else showMsg(r.message, "err");
}
async function doRegister() { const r = await post({ type: "reg-complete", name: document.getElementById('regName').value, roll: document.getElementById('regRoll').value, email: document.getElementById('regEmail').value, branch: document.getElementById('regBranch').value, password: document.getElementById('regPass').value, otp: document.getElementById('regOtp').value }, 'btnRegFinal'); if(r.status==="success") { showMsg("Account Created! Login now.", "ok"); setTimeout(()=>setView('login'), 2000); } else showMsg(r.message, "err"); }
async function sendForgotOtp() { const r = await post({ type:"forgot-send-otp", email:document.getElementById('forgotEmail').value }, 'btnForgotOtp'); if(r.status==="otp_sent") { document.getElementById('forgotStep1').classList.add('hidden'); document.getElementById('forgotStep2').classList.remove('hidden'); } else showMsg(r.message, "err"); }
async function doReset() { const r = await post({ type: "forgot-complete", email: document.getElementById('forgotEmail').value, otp: document.getElementById('forgotOtp').value, newPassword: document.getElementById('forgotNewPass').value }, 'btnForgotFinal'); if(r.status==="success") { showMsg("Password updated successfully!", "ok"); setTimeout(()=>setView('login'), 2000); } else showMsg(r.message, "err"); }

// keep step 2 hidden until otp sent
document.getElementById('forgotStep2').classList.add('hidden');
</script>
</body>
</html>
